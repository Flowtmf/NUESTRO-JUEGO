<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>El viaje ❤️ — Fase 1: Bosque del Comienzo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b18;font-family:monospace;touch-action:none}
canvas{
  display:block;width:100vw;height:100vh;
  object-fit:contain;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  background:#080b18;
}
#hud{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));z-index:20;color:#fff;text-shadow:2px 2px #000;pointer-events:none}
#hearts{font-size:clamp(16px,2.2vw,24px);letter-spacing:2px}
#bar{width:clamp(150px,20vw,220px);height:13px;background:#171525;border:2px solid #eee;margin-top:4px;box-shadow:2px 2px #000}
#hpbar{height:100%;width:100%;background:#df5277;transition:width .12s}
#flowerCounter{margin-top:6px;font-size:clamp(12px,1.8vw,18px)}
#areaName{
 position:fixed;top:12%;left:50%;transform:translateX(-50%);z-index:18;
 color:#fff;font-size:clamp(14px,2vw,22px);text-shadow:2px 2px #000;
 opacity:0;transition:opacity .45s;pointer-events:none;text-align:center;
}
#msg{
 position:fixed;left:50%;bottom:105px;transform:translateX(-50%);z-index:30;
 width:min(760px,88vw);padding:13px 18px;background:rgba(7,8,20,.94);
 border:2px solid #f0d9ff;color:#fff;text-align:center;line-height:1.45;
 font-size:clamp(12px,1.8vw,17px);display:none;border-radius:8px;
}
#overlay{position:fixed;inset:0;z-index:50;background:rgba(5,6,16,.96);display:none;align-items:center;justify-content:center;color:#fff;padding:20px}
.panel{width:min(760px,90vw);max-height:86vh;overflow:auto;border:2px solid #c9a5ff;padding:24px;background:#0d1024;box-shadow:0 0 30px rgba(190,120,255,.2)}
.panel h1{margin-top:0;color:#e8c5ff}
.panel p{line-height:1.7}
.panel button{padding:10px 22px;background:#26223a;color:#fff;border:2px solid #fff;font:inherit;border-radius:6px}
#pause{
 position:fixed;right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));
 z-index:30;width:44px;height:44px;border:2px solid #fff;background:rgba(10,10,20,.6);
 color:#fff;border-radius:8px;font-size:18px
}
#hint{position:fixed;right:65px;top:22px;color:#ddd;font-size:11px;text-shadow:1px 1px #000;z-index:18;opacity:.72}
#bossUI{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:25;display:none;width:min(420px,52vw);pointer-events:none}
#bossName{text-align:center;color:#fff;text-shadow:2px 2px #000;font-size:13px;margin-bottom:4px}
#bossBar{height:14px;border:2px solid #fff;background:#1a1423;box-shadow:2px 2px #000}
#bossHp{height:100%;width:100%;background:#bd61e8}
#controls{position:fixed;z-index:40;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 14px;pointer-events:none}
.grp{display:flex;gap:9px;pointer-events:auto}
.ctrl{
 width:clamp(54px,8vw,68px);height:clamp(54px,8vw,68px);border-radius:14px;
 border:2px solid rgba(255,255,255,.85);background:rgba(17,18,31,.68);color:#fff;
 font:clamp(22px,4vw,29px) monospace;touch-action:none;user-select:none;-webkit-user-select:none
}
.ctrl:active{background:rgba(255,255,255,.25)}
@media(max-width:700px){#hint{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="hearts">❤️❤️❤️</div>
  <div id="bar"><div id="hpbar"></div></div>
  <div id="flowerCounter">🌸 Flores 0/8</div>
</div>
<div id="areaName"></div>
<div id="hint">A/D · ←/→ · Espacio/W/↑ · J/Z</div>
<button id="pause">Ⅱ</button>

<div id="bossUI">
  <div id="bossName">ESPÍRITU GUARDIÁN</div>
  <div id="bossBar"><div id="bossHp"></div></div>
</div>

<div id="msg"></div>

<div id="overlay">
  <div class="panel" id="panel"></div>
</div>

<div id="controls">
  <div class="grp">
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="right">▶</button>
  </div>
  <div class="grp">
    <button class="ctrl" id="attack">⚔</button>
    <button class="ctrl" id="jump">▲</button>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   EL VIAJE — FASE 1
   El código usa 960x540 internamente y CSS mantiene 16:9.
   Los sprites están en /assets.
========================================================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
canvas.width=960; canvas.height=540;

const VIEW={w:960,h:540};
const WORLD={w:5200,h:540};
const camera={x:0};
const input={left:false,right:false};
let paused=false,time=0,shake=0,finished=false;

function load(path){
  const i=new Image();
  i.src=path;
  return i;
}

const A={
  sky:load("assets/sky.jpg"),
  mountains:load("assets/mountains.jpg"),
  trees:load("assets/trees.jpg"),
  playerIdle:load("assets/player_idle.png"),
  playerWalk:load("assets/player_walk.png"),
  playerJump:load("assets/player_jump.png"),
  playerAttack:load("assets/player_attack.png"),
  playerHurt:load("assets/player_hurt.png"),
  enemyIdle:load("assets/enemy_idle.png"),
  enemyWalk:load("assets/enemy_walk.png"),
  enemyAttack:load("assets/enemy_attack.png"),
  enemyHurt:load("assets/enemy_hurt.png"),
  enemyDeath:load("assets/enemy_death.png")
};

/* ---------- LEVEL ---------- */

const platforms=[
  {x:0,y:474,w:650,h:66},
  {x:720,y:474,w:510,h:66},
  {x:1300,y:474,w:690,h:66},
  {x:2070,y:474,w:590,h:66},
  {x:2740,y:474,w:700,h:66},
  {x:3520,y:474,w:760,h:66},
  {x:4360,y:474,w:840,h:66},

  {x:230,y:392,w:170,h:18},
  {x:500,y:338,w:155,h:18},
  {x:810,y:385,w:180,h:18},
  {x:1050,y:315,w:185,h:18},
  {x:1390,y:375,w:175,h:18},
  {x:1670,y:315,w:180,h:18},
  {x:2130,y:385,w:175,h:18},
  {x:2390,y:325,w:190,h:18},
  {x:2860,y:385,w:180,h:18},
  {x:3150,y:320,w:195,h:18},
  {x:3650,y:382,w:180,h:18},
  {x:3940,y:320,w:190,h:18},
  {x:4510,y:380,w:190,h:18},
  {x:4780,y:315,w:190,h:18}
];

const walls=[
  {x:650,y:340,w:70,h:134},
  {x:1230,y:350,w:70,h:124},
  {x:1990,y:335,w:80,h:139},
  {x:2660,y:350,w:80,h:124},
  {x:3440,y:335,w:80,h:139},
  {x:4280,y:350,w:80,h:124}
];

const flowers=[
 {x:305,y:344,text:"Desde que llegaste, mis días comenzaron a sentirse diferentes."},
 {x:555,y:290,text:"Hay recuerdos pequeños que terminan significando muchísimo."},
 {x:880,y:337,text:"A veces el camino más bonito es el que recorremos juntos."},
 {x:1110,y:267,text:"No importa cuánto falte: quiero seguir avanzando contigo."},
 {x:1460,y:327,text:"Si encuentras esta flor, recuerda que todavía quedan muchos momentos por vivir."},
 {x:1740,y:267,text:"Cada paso que das te acerca un poquito más al final."},
 {x:2450,y:277,text:"Y si alguna vez te pierdes, busca las pequeñas luces."},
 {x:3225,y:272,text:"La última flor no es el final... es la puerta hacia algo más. ❤️"}
].map(f=>({...f,taken:false}));

const enemies=[
 makeEnemy(760,430,690,960,1.15,45),
 makeEnemy(1350,430,1310,1580,1.25,55),
 makeEnemy(1800,430,1600,1930,1.2,60),
 makeEnemy(2180,430,2100,2580,1.45,65),
 makeEnemy(2910,430,2770,3350,1.5,70),
 makeEnemy(3650,430,3530,4050,1.35,80),
 makeEnemy(4470,430,4380,4780,1.4,85)
];

function makeEnemy(x,y,left,right,speed,hp){
 return {x,y,w:48,h:44,left,right,speed,dir:1,hp,maxHp:hp,state:"walk",
 frame:0,ft:0,hit:0,attackCd:80,attackTimer:0,deadTimer:0,knock:0,knockVx:0,remove:false};
}

const boss={
 x:4780,y:397,w:64,h:62,left:4630,right:5100,speed:1.05,dir:-1,
 hp:220,maxHp:220,state:"walk",frame:0,ft:0,hit:0,attackCd:80,
 attackTimer:0,knock:0,knockVx:0,alive:true
};

const door={x:5115,y:394,w:55,h:80};
const checkpoints=[100,1300,2740,3520,4360];
let checkpoint=100;
let currentArea=-1;

function overlap(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

function solids(){return platforms.concat(walls)}

function moveHorizontal(ent,dx){
 const old=ent.x;
 ent.x+=dx;
 for(const p of solids()){
   if(ent.y+ent.h>p.y && ent.y<p.y+p.h){
     if(ent.x+ent.w>p.x && old+ent.w<=p.x) ent.x=p.x-ent.w;
     if(ent.x<p.x+p.w && old>=p.x+p.w) ent.x=p.x+p.w;
   }
 }
}

function moveVertical(ent){
 const old=ent.y;
 ent.vy += .62;
 ent.y += ent.vy;
 ent.ground=false;

 for(const p of solids()){
   if(ent.x+ent.w>p.x && ent.x<p.x+p.w){
     if(old+ent.h<=p.y && ent.y+ent.h>=p.y){
       ent.y=p.y-ent.h;ent.vy=0;ent.ground=true;
     }
     if(old>=p.y+p.h && ent.y<=p.y+p.h){
       ent.y=p.y+p.h;ent.vy=0;
     }
   }
 }
}

/* ---------- PLAYER ---------- */

const player={
 x:100,y:400,w:38,h:68,vy:0,speed:4.8,jump:-13.2,ground:false,dir:1,
 state:"idle",frame:0,ft:0,attack:false,attackTimer:0,
 hp:100,maxHp:100,hearts:3,inv:0,knock:0,knockVx:0
};

function jump(){
 if(!paused && player.ground){
   player.vy=player.jump;
   player.ground=false;
 }
}

function attack(){
 if(paused||player.attack||player.inv>0)return;
 player.attack=true;
 player.attackTimer=22;
}

function playerAttackBox(){
 return {
   x:player.dir>0?player.x+22:player.x-66,
   y:player.y+13,w:66,h:42
 };
}

function damagePlayer(amount,sourceX){
 if(player.inv>0)return;
 player.hp=Math.max(0,player.hp-amount);
 player.inv=75;
 player.knock=14;
 player.knockVx=player.x<sourceX?-7:7;
 player.vy=-7;
 shake=8;
 updateHUD();

 if(player.hp<=0)respawn();
}

function respawn(){
 player.x=checkpoint;
 player.y=390;
 player.vy=0;
 player.hp=100;
 player.inv=100;
 player.attack=false;
 player.hearts--;
 if(player.hearts<=0)player.hearts=3;
 updateHUD();
 showMessage("Has perdido tus fuerzas... vuelves al último punto de descanso.");
}

/* ---------- ENEMIES ---------- */

function hitEnemy(e,damage=20){
 if(!player.attack||e.remove||e.deadTimer>0)return;
 if(e.hit>0)return;

 if(overlap(playerAttackBox(),e)){
   e.hp=Math.max(0,e.hp-damage);
   e.hit=12;
   e.knock=13;
   e.knockVx=player.dir*7;
   shake=5;

   if(e.hp<=0){
     e.deadTimer=28;
     e.state="death";
   }
 }
}

function enemyAI(e){
 if(e.remove)return;

 if(e.deadTimer>0){
   e.deadTimer--;
   e.frame=Math.min(3,Math.floor((28-e.deadTimer)/7));
   if(e.deadTimer===0)e.remove=true;
   return;
 }

 if(e.hit>0)e.hit--;

 if(e.knock>0){
   e.x+=e.knockVx;
   e.knockVx*=.80;
   e.knock--;
   return;
 }

 const dx=player.x-e.x;
 const near=Math.abs(dx)<210 && Math.abs(player.y-e.y)<90;

 if(near){
   e.dir=dx<0?-1:1;
   if(e.attackCd<=0){
     e.state="attack";
     e.attackTimer=32;
     e.attackCd=100;
   }
 }else{
   e.state="walk";
   e.x+=e.dir*e.speed;
   if(e.x<e.left){e.x=e.left;e.dir=1}
   if(e.x>e.right){e.x=e.right;e.dir=-1}
 }

 if(e.attackCd>0)e.attackCd--;

 if(e.attackTimer>0){
   e.attackTimer--;
   if(e.attackTimer===10){
     const box={
       x:e.dir>0?e.x+26:e.x-38,
       y:e.y+7,w:38,h:44
     };
     if(overlap(player,box))damagePlayer(10,e.x);
   }
   if(e.attackTimer===0)e.state="walk";
 }

 hitEnemy(e);
 animateEnemy(e);
}

function bossAI(){
 if(!boss.alive)return;

 if(boss.hit>0)boss.hit--;

 if(boss.knock>0){
   boss.x+=boss.knockVx;
   boss.knockVx*=.84;
   boss.knock--;
   return;
 }

 const dx=player.x-boss.x;

 if(Math.abs(dx)<360){
   boss.dir=dx<0?-1:1;

   if(boss.attackCd<=0){
     boss.state="attack";
     boss.attackTimer=42;
     boss.attackCd=110;
   }else{
     boss.state="walk";
     boss.x+=boss.dir*boss.speed;
   }
 }else{
   boss.state="walk";
   boss.x+=boss.dir*boss.speed;
 }

 if(boss.x<boss.left){boss.x=boss.left;boss.dir=1}
 if(boss.x>boss.right){boss.x=boss.right;boss.dir=-1}
 if(boss.attackCd>0)boss.attackCd--;

 if(boss.attackTimer>0){
   boss.attackTimer--;
   if(boss.attackTimer===13){
     const box={
       x:boss.dir>0?boss.x+35:boss.x-50,
       y:boss.y+8,w:50,h:55
     };
     if(overlap(player,box))damagePlayer(18,boss.x);
     shake=8;
   }
   if(boss.attackTimer===0)boss.state="walk";
 }

 if(player.attack && overlap(playerAttackBox(),boss) && boss.hit<=0){
   boss.hp=Math.max(0,boss.hp-15);
   boss.hit=13;
   boss.knock=11;
   boss.knockVx=player.dir*5.5;
   shake=7;

   if(boss.hp<=0){
     boss.alive=false;
     showMessage("El Espíritu Guardián ha caído. La puerta está abierta. ❤️");
   }
 }

 animateEnemy(boss);
}

function animateEnemy(e){
 const counts=e.state==="attack"?4:e.state==="hurt"?3:e.state==="death"?4:6;
 if(++e.ft>=8){e.ft=0;e.frame=(e.frame+1)%counts}
}

/* ---------- FLOWERS / CHECKPOINTS ---------- */

function updateFlowers(){
 for(const f of flowers){
   if(!f.taken && overlap(player,{x:f.x,y:f.y,w:28,h:42})){
     f.taken=true;
     showMessage("🌸 "+f.text);
     updateHUD();

     if(flowers.every(f=>f.taken)){
       setTimeout(showAllFlowers,450);
     }
   }
 }
}

/* ---------- HUD ---------- */

function updateHUD(){
 document.getElementById("hearts").textContent="❤️".repeat(player.hearts);
 const pct=(player.hp/player.maxHp)*100;
 document.getElementById("hpbar").style.width=pct+"%";
 document.getElementById("flowerCounter").textContent=
   "🌸 Flores "+flowers.filter(f=>f.taken).length+"/8";

 const bossUI=document.getElementById("bossUI");
 if(boss.alive && Math.abs(player.x-boss.x)<650){
   bossUI.style.display="block";
   document.getElementById("bossHp").style.width=(boss.hp/boss.maxHp*100)+"%";
 }else bossUI.style.display="none";
}

let messageTimer=0;
function showMessage(text){
 const el=document.getElementById("msg");
 el.textContent=text;
 el.style.display="block";
 clearTimeout(messageTimer);
 messageTimer=setTimeout(()=>el.style.display="none",3800);
}

function showAllFlowers(){
 const panel=document.getElementById("panel");
 panel.innerHTML="<h1>🌸 Todas las flores</h1>"+
   flowers.map(f=>"<p>🌸 "+f.text+"</p>").join("")+
   '<button id="closeFlowers">Continuar</button>';
 document.getElementById("overlay").style.display="flex";
 document.getElementById("closeFlowers").onclick=()=>{
   document.getElementById("overlay").style.display="none";
 };
}

/* ---------- AREAS ---------- */

const areas=[
 "Bosque de entrada",
 "Arboleda de los recuerdos",
 "Ruinas cubiertas",
 "Cascada de las luces",
 "El camino del Guardián",
 "Santuario del Guardián"
];

function showArea(name){
 const el=document.getElementById("areaName");
 el.textContent=name;
 el.style.opacity=1;
 setTimeout(()=>el.style.opacity=0,2200);
}

/* ---------- DRAWING ---------- */

function drawSheet(im,frame,fw,fh,dx,dy,dw,dh,flip=false){
 if(!im.complete || !im.naturalWidth)return;

 ctx.save();

 if(flip){
   ctx.translate(dx+dw,dy);
   ctx.scale(-1,1);
   ctx.drawImage(im,frame*fw,0,fw,fh,0,0,dw,dh);
 }else{
   ctx.drawImage(im,frame*fw,0,fw,fh,dx,dy,dw,dh);
 }

 ctx.restore();
}

function drawBackground(){
 // Base
 ctx.fillStyle="#080b18";
 ctx.fillRect(0,0,VIEW.w,VIEW.h);

 // Sky — clean asset, no labels
 if(A.sky.complete)ctx.drawImage(A.sky,0,0,VIEW.w,250);

 // distant mountains
 if(A.mountains.complete){
   const offset=-(camera.x*.10)%VIEW.w;
   ctx.drawImage(A.mountains,offset,150,VIEW.w,240);
   ctx.drawImage(A.mountains,offset+VIEW.w,150,VIEW.w,240);
 }

 // trees
 if(A.trees.complete){
   const offset=-(camera.x*.25)%VIEW.w;
   ctx.drawImage(A.trees,offset,225,VIEW.w,260);
   ctx.drawImage(A.trees,offset+VIEW.w,225,VIEW.w,260);
 }

 // atmospheric fog
 const grad=ctx.createLinearGradient(0,300,0,540);
 grad.addColorStop(0,"rgba(10,20,35,.03)");
 grad.addColorStop(1,"rgba(4,7,15,.65)");
 ctx.fillStyle=grad;
 ctx.fillRect(0,280,VIEW.w,260);

 // little distant lights
 for(let i=0;i<7;i++){
   const x=((i*173-camera.x*.35)%1100+1100)%1100-70;
   const y=305+(i%3)*22;
   ctx.fillStyle="rgba(245,201,113,.65)";
   ctx.fillRect(x,y,4,7);
   ctx.fillStyle="rgba(245,201,113,.10)";
   ctx.beginPath();ctx.arc(x+2,y+3,18,0,Math.PI*2);ctx.fill();
 }
}

function drawPlatforms(){
 for(const p of platforms){
   const x=p.x-camera.x;
   if(x>VIEW.w+20||x+p.w<-20)continue;

   // stone body
   ctx.fillStyle="#2a2738";
   ctx.fillRect(x,p.y,p.w,p.h);

   // moss
   ctx.fillStyle="#63744f";
   ctx.fillRect(x,p.y,p.w,7);

   // pixel stone blocks
   for(let xx=x;xx<x+p.w;xx+=32){
     ctx.fillStyle="#393348";
     ctx.fillRect(xx,p.y+11,26,Math.max(8,p.h-11));
   }

   // tiny grass pixels
   ctx.fillStyle="#82925a";
   for(let xx=x+5;xx<x+p.w-4;xx+=22){
     ctx.fillRect(xx,p.y-3,3,4);
   }
 }

 // walls / pillars
 for(const w of walls){
   const x=w.x-camera.x;
   if(x>VIEW.w+20||x+w.w<-20)continue;

   ctx.fillStyle="#252337";
   ctx.fillRect(x,w.y,w.w,w.h);
   ctx.fillStyle="#667651";
   ctx.fillRect(x,w.y,w.w,7);

   for(let y=w.y+18;y<w.y+w.h;y+=28){
     ctx.fillStyle="#363047";
     ctx.fillRect(x+5,y,w.w-10,20);
   }
 }
}

function drawFlower(f){
 if(f.taken)return;

 const x=f.x-camera.x;
 const y=f.y;
 const pulse=1+Math.sin(time*.08+f.x)*.08;

 // glow
 ctx.fillStyle="rgba(230,150,255,.13)";
 ctx.beginPath();ctx.arc(x+15,y+18,24,0,Math.PI*2);ctx.fill();

 // stem
 ctx.fillStyle="#5d9857";
 ctx.fillRect(x+13,y+16,4,27);

 // petals
 ctx.fillStyle="#efa6ff";
 [[15,11],[8,18],[22,18],[15,25]].forEach(([a,b])=>{
   ctx.beginPath();ctx.arc(x+a,y+b,7*pulse,0,Math.PI*2);ctx.fill();
 });

 ctx.fillStyle="#ffe18b";
 ctx.fillRect(x+11,y+14,8,8);
}

function drawEnemy(e,isBoss=false){
 if(e.remove)return;

 const x=e.x-camera.x;
 const y=e.y;

 let im=A.enemyWalk;
 let count=6;

 if(e.state==="attack"){im=A.enemyAttack;count=4}
 else if(e.state==="death"){im=A.enemyDeath;count=4}
 else if(e.state==="hurt"){im=A.enemyHurt;count=3}

 const dw=isBoss?100:76;
 const dh=isBoss?112:84;

 if(e.hit>0)ctx.globalAlpha=.62;

 drawSheet(
   im,
   Math.min(e.frame,count-1),
   128,176,
   x-(dw-e.w)/2,
   y-(dh-e.h),
   dw,dh,
   e.dir<0
 );

 ctx.globalAlpha=1;

 if(e.hp>0 && !isBoss){
   ctx.fillStyle="#15121f";
   ctx.fillRect(x,y-12,e.w,6);
   ctx.fillStyle="#d65376";
   ctx.fillRect(x,y-12,e.w*(e.hp/e.maxHp),6);
 }

 if(e.state==="attack" && e.attackTimer<20){
   ctx.strokeStyle="rgba(255,120,210,.35)";
   ctx.lineWidth=4;
   ctx.beginPath();
   ctx.arc(x+e.w/2,y+e.h/2,34,0,Math.PI*2);
   ctx.stroke();
 }
}

function drawPlayer(){
 if(player.inv>0 && Math.floor(player.inv/5)%2===0)return;

 const x=player.x-camera.x;
 const y=player.y;

 let im=A.playerIdle;
 let count=4;

 if(player.state==="walk"){im=A.playerWalk;count=6}
 else if(player.state==="jump"||player.state==="fall"){im=A.playerJump;count=4}
 else if(player.state==="attack"){im=A.playerAttack;count=4}
 else if(player.state==="hurt"){im=A.playerHurt;count=4}

 const dw=94,dh=129;

 drawSheet(
   im,
   Math.min(player.frame,count-1),
   128,176,
   x-(dw-player.w)/2,
   y-(dh-player.h),
   dw,dh,
   player.dir<0
 );

 // attack arc
 if(player.attack){
   ctx.strokeStyle="rgba(241,194,255,.95)";
   ctx.lineWidth=5;
   ctx.beginPath();
   const ax=player.dir>0?x+36:x-36;
   ctx.arc(
     ax,y+32,34,
     player.dir>0?-0.95:Math.PI+0.95,
     player.dir>0?0.95:Math.PI-0.95
   );
   ctx.stroke();
 }
}

function drawDoor(){
 const x=door.x-camera.x;
 if(x>VIEW.w+100||x<-100)return;

 ctx.fillStyle="#171322";
 ctx.fillRect(x,door.y,door.w,door.h);

 ctx.strokeStyle="#b88bd2";
 ctx.lineWidth=4;
 ctx.strokeRect(x,door.y,door.w,door.h);

 ctx.fillStyle="#f1c8ff";
 ctx.beginPath();
 ctx.arc(x+43,door.y+40,5,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="rgba(220,150,255,.15)";
 ctx.beginPath();
 ctx.arc(x+30,door.y+40,38,0,Math.PI*2);
 ctx.fill();
}

function drawWorldDecor(){
 // signs
 const signs=[
   {x:170,text:"🌸"},
   {x:1260,text:"✦"},
   {x:2720,text:"✦"},
   {x:3510,text:"🌙"},
   {x:4320,text:"⚔"}
 ];

 ctx.font="20px monospace";
 for(const s of signs){
   const x=s.x-camera.x;
   if(x>-30&&x<VIEW.w+30){
     ctx.fillStyle="rgba(255,255,255,.65)";
     ctx.fillText(s.text,x,455);
   }
 }
}

function draw(){
 ctx.save();

 if(shake>0){
   ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
   shake*=.82;
   if(shake<.2)shake=0;
 }

 drawBackground();
 drawWorldDecor();
 drawPlatforms();

 flowers.forEach(drawFlower);
 drawDoor();

 enemies.forEach(e=>drawEnemy(e,false));
 if(boss.alive)drawEnemy(boss,true);

 drawPlayer();

 ctx.restore();
}

/* ---------- PLAYER UPDATE ---------- */

function updatePlayer(){
 if(player.knock>0){
   moveHorizontal(player,player.knockVx);
   player.knockVx*=.78;
   player.knock--;
 }else{
   const move=(input.right?1:0)-(input.left?1:0);
   moveHorizontal(player,move*player.speed);
   if(move)player.dir=move;
 }

 moveVertical(player);

 player.x=Math.max(0,Math.min(WORLD.w-player.w,player.x));

 if(player.inv>0)player.inv--;

 if(player.attackTimer>0){
   player.attackTimer--;
   if(player.attackTimer===0)player.attack=false;
 }

 for(const c of checkpoints){
   if(player.x>=c)checkpoint=c;
 }

 const area=Math.min(5,Math.floor(player.x/900));
 if(area!==currentArea){
   currentArea=area;
   showArea(areas[area]);
 }

 if(player.attack)player.state="attack";
 else if(!player.ground)player.state=player.vy<0?"jump":"fall";
 else if(player.inv>0)player.state="hurt";
 else if(input.left||input.right)player.state="walk";
 else player.state="idle";

 const counts={idle:4,walk:6,jump:4,fall:4,attack:4,hurt:4};
 if(++player.ft>=8){
   player.ft=0;
   player.frame=(player.frame+1)%counts[player.state];
 }

 camera.x=player.x-VIEW.w*.42;
 camera.x=Math.max(0,Math.min(camera.x,WORLD.w-VIEW.w));
}

/* ---------- GAME UPDATE ---------- */

function update(){
 if(paused)return;

 time++;

 updatePlayer();
 updateFlowers();

 enemies.forEach(enemyAI);
 bossAI();

 updateHUD();

 if(overlap(player,door)){
   if(boss.alive)showMessage("El Guardián todavía bloquea el camino. 🌙");
   else finishPhase();
 }
}

function finishPhase(){
 if(finished)return;
 finished=true;

 const panel=document.getElementById("panel");
 panel.innerHTML=
  "<h1>🌲 Fase 1 completada</h1>"+
  "<p>Has atravesado el Bosque del Comienzo, reunido las flores y vencido al Espíritu Guardián.</p>"+
  "<p>❤️ Lo que sigue será la <strong>Cueva de los Recuerdos</strong>.</p>"+
  '<button id="end">Seguir explorando</button>';

 document.getElementById("overlay").style.display="flex";
 document.getElementById("end").onclick=()=>{
   document.getElementById("overlay").style.display="none";
 };
}

/* ---------- PAUSE ---------- */

function togglePause(){
 paused=!paused;
 document.getElementById("pause").textContent=paused?"▶":"Ⅱ";
}

/* ---------- INPUT ---------- */

addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();

 if(k==="a"||e.key==="ArrowLeft")input.left=true;
 if(k==="d"||e.key==="ArrowRight")input.right=true;
 if(k==="w"||e.key==="ArrowUp"||e.key===" ")jump();
 if(k==="j"||k==="z")attack();
 if(k==="escape")togglePause();
});

addEventListener("keyup",e=>{
 const k=e.key.toLowerCase();

 if(k==="a"||e.key==="ArrowLeft")input.left=false;
 if(k==="d"||e.key==="ArrowRight")input.right=false;
});

function holdButton(id,on,off){
 const b=document.getElementById(id);

 b.addEventListener("touchstart",e=>{
   e.preventDefault();on();
 },{passive:false});

 b.addEventListener("touchend",e=>{
   e.preventDefault();off();
 },{passive:false});

 b.addEventListener("touchcancel",e=>{
   e.preventDefault();off();
 },{passive:false});

 b.addEventListener("mousedown",on);
 b.addEventListener("mouseup",off);
 b.addEventListener("mouseleave",off);
}

holdButton("left",()=>input.left=true,()=>input.left=false);
holdButton("right",()=>input.right=true,()=>input.right=false);

document.getElementById("jump").addEventListener("touchstart",e=>{
 e.preventDefault();jump();
},{passive:false});
document.getElementById("jump").addEventListener("mousedown",jump);

document.getElementById("attack").addEventListener("touchstart",e=>{
 e.preventDefault();attack();
},{passive:false});
document.getElementById("attack").addEventListener("mousedown",attack);

document.getElementById("pause").onclick=togglePause;

/* ---------- START ---------- */
updateHUD();
showArea("Bosque de entrada");

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
